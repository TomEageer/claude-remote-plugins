<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>Word 预览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar" id="toolbar" hidden>
  <button class="btn" id="zoomOut" title="缩小"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
  <span class="label zoom-label" id="zoomLabel">100%</span>
  <button class="btn" id="zoomIn" title="放大"><svg viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button>
  <button class="btn" id="fitWidth" title="适合宽度">适合宽度</button>
  <button class="btn" id="actual" title="实际大小">100%</button>
  <span class="spacer"></span>
  <span class="label" id="info"></span>
</div>
<div class="content" id="viewer"><div id="doc" class="doc-host"></div></div>
<div class="state" id="state"><div class="spinner"></div><div class="title">正在加载…</div></div>
<script src="bridge.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/docx-preview.min.js"></script>
<script src="app.js"></script>
</body>
</html>
