<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>代码与文本预览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar" id="toolbar" hidden>
  <span class="label" id="info"></span>
  <span class="spacer"></span>
  <div class="seg" id="mdSwitch" hidden>
    <button class="btn" id="viewDoc">文档</button>
    <button class="btn" id="viewSrc">源码</button>
  </div>
</div>
<div class="notice" id="notice" hidden></div>
<div class="content" id="viewer">
  <div class="code" id="code" hidden><pre class="gutter" id="gutter" aria-hidden="true"></pre><pre class="src"><code class="hljs" id="src"></code></pre></div>
  <article class="markdown" id="md" hidden></article>
</div>
<div class="state" id="state"><div class="spinner"></div><div class="title">正在加载…</div></div>
<script src="bridge.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
